<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ein Jahr mit dir</title>
<meta name="theme-color" content="#0E2430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E2430;
    --night-2:#143241;
    --ticket:#F4E9D6;
    --ticket-edge:#E2D2B6;
    --amber:#F0A93B;
    --rose:#E0596E;
    --ink:#22333B;
    --ink-soft:#5C6E77;
    --ok:#3F8F6B;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 70% at 50% -10%, #1B4257 0%, rgba(27,66,87,0) 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(224,89,110,.18) 0%, rgba(224,89,110,0) 70%),
      var(--night);
    color:var(--ticket);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom));
  }
  .app{width:100%;max-width:470px}

  /* ---------- Routenleiste (Signature) ---------- */
  .route{display:flex;align-items:center;gap:10px;margin:6px 2px 20px}
  .route-code{
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;
    color:var(--ticket);opacity:.85
  }
  .route-line{position:relative;flex:1;height:22px}
  .route-line::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:0;
    border-top:1.5px dashed rgba(244,233,214,.32)
  }
  .dots{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(244,233,214,.3);transition:background .35s,transform .35s}
  .dot.on{background:var(--amber);transform:scale(1.35)}
  .plane{
    position:absolute;top:50%;left:0;transform:translate(-50%,-52%);
    font-size:15px;line-height:1;transition:left .55s cubic-bezier(.4,1.3,.5,1);
    filter:drop-shadow(0 0 6px rgba(240,169,59,.5))
  }

  /* ---------- Ticket ---------- */
  .ticket{
    background:var(--ticket);color:var(--ink);border-radius:var(--r);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.7);
    overflow:hidden;position:relative
  }
  .ticket-top{padding:22px 20px 18px}
  .perf{
    position:relative;height:20px;
    background:
      radial-gradient(circle at 0 50%, var(--night) 9px, rgba(0,0,0,0) 10px) left/50.5% no-repeat,
      radial-gradient(circle at 100% 50%, var(--night) 9px, rgba(0,0,0,0) 10px) right/50.5% no-repeat;
  }
  .perf::after{
    content:"";position:absolute;left:14px;right:14px;top:50%;
    border-top:1.5px dashed var(--ticket-edge)
  }
  .ticket-bottom{padding:16px 20px 22px}

  .kicker{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px
  }
  h1{
    font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-.035em;
    font-size:clamp(34px,10.5vw,46px);line-height:.98;margin:0 0 12px;color:var(--ink)
  }
  h2{
    font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;
    font-size:clamp(21px,5.6vw,25px);line-height:1.18;margin:0 0 6px;color:var(--ink)
  }
  p{margin:0 0 14px;line-height:1.55;color:var(--ink)}
  .muted{color:var(--ink-soft);font-size:14.5px}

  /* ---------- Buttons ---------- */
  .btn{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.01em;
    background:var(--ink);color:var(--ticket);padding:15px 20px;border-radius:11px;
    width:100%;transition:transform .12s,background .2s
  }
  .btn:active{transform:translateY(1px)}
  .btn.rose{background:var(--rose);color:#fff}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .opts{display:grid;gap:9px;margin:16px 0 0}
  .opt{
    text-align:left;background:#fff;border:1.5px solid var(--ticket-edge);color:var(--ink);
    padding:14px 15px;border-radius:11px;font:500 15.5px 'Karla',sans-serif;cursor:pointer;
    display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s
  }
  .opt .mark{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    border:1.5px solid var(--ticket-edge);border-radius:6px;padding:2px 6px;flex:none
  }
  .opt:hover:not(:disabled){border-color:var(--ink)}
  .opt.correct{border-color:var(--ok);background:rgba(63,143,107,.1)}
  .opt.correct .mark{border-color:var(--ok);color:var(--ok)}
  .opt.wrong{border-color:var(--rose);background:rgba(224,89,110,.1)}
  .opt.wrong .mark{border-color:var(--rose);color:var(--rose)}
  .opt:disabled{cursor:default}

  /* ---------- Slider ---------- */
  .readout{
    font-family:'Archivo',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.04em;
    color:var(--ink);margin:18px 0 2px;font-variant-numeric:tabular-nums
  }
  .readout span{font-size:17px;font-weight:500;color:var(--ink-soft);margin-left:6px;letter-spacing:0}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:6px 0 2px
  }
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--ticket-edge)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);
    border:4px solid var(--ticket);margin-top:-13px;box-shadow:0 2px 8px rgba(0,0,0,.25)
  }
  input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:var(--ticket-edge)}
  input[type=range]::-moz-range-thumb{
    width:26px;height:26px;border:4px solid var(--ticket);border-radius:50%;background:var(--ink)
  }
  .scale{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:14px
  }

  /* ---------- Auflösung ---------- */
  .verdict{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;margin:0 0 10px
  }
  .verdict.hit{color:var(--ok)}
  .verdict.miss{color:var(--rose)}
  .log{margin:0 0 14px;border-top:1.5px dashed var(--ticket-edge)}
  .log-row{
    display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1.5px dashed var(--ticket-edge);font-size:14.5px
  }
  .log-row span:last-child{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .log-row.total{font-weight:700;border-bottom:0}
  .log-row.total span:last-child{color:var(--rose)}

  /* ---------- Score ---------- */
  .stamp{
    display:inline-block;transform:rotate(-7deg);border:2.5px solid var(--rose);color:var(--rose);
    border-radius:9px;padding:9px 15px;font-family:'Archivo',sans-serif;font-weight:800;
    font-size:23px;letter-spacing:-.02em;margin:6px 0 16px
  }
  .stamp small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;font-weight:400}

  /* ---------- Finale ---------- */
  .finale{position:relative;min-height:230px;margin-top:18px}
  .finale .btn.rose{position:relative;z-index:2;max-width:230px}
  #no{
    position:absolute;width:130px;background:#fff;color:var(--ink-soft);
    border:1.5px solid var(--ticket-edge);font-size:15px;padding:13px 10px;z-index:1;
    transition:left .28s ease,top .28s ease,transform .28s ease,opacity .3s
  }
  .gave-up{font-size:13.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:12px}

  /* ---------- Video ---------- */
  .video-wrap{background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}  video{width:100%;display:block;max-height:74dvh;background:#000}
  .yt{
    position:relative;aspect-ratio:9/16;width:100%;
    max-height:86dvh;max-width:calc(86dvh * 9 / 16);margin:0 auto
  }
  .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt:fullscreen{max-width:none;max-height:none;width:100%;height:100%;aspect-ratio:auto}
  #s-video.active{min-height:88dvh;display:flex;flex-direction:column;justify-content:center}
  .after{text-align:center;margin-top:20px}
  .after h2{color:var(--ticket)}
  .after .muted{color:rgba(244,233,214,.6)}
  .vid-note{
    background:var(--ticket);color:var(--ink);border-radius:var(--r);padding:20px;
    font-size:14.5px;line-height:1.55
  }
  code{font-family:'IBM Plex Mono',monospace;background:rgba(34,51,59,.08);padding:1px 5px;border-radius:4px}

  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .screen{display:none}
  .screen.active{display:block;animation:pull .45s cubic-bezier(.2,.9,.3,1)}
  @keyframes pull{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <div class="route" aria-hidden="true">
    <span class="route-code" id="from">KEV</span>
    <span class="route-line">
      <span class="dots" id="dots"></span>
      <span class="plane" id="plane">✈</span>
    </span>
    <span class="route-code" id="to">NIN</span>
  </div>

  <!-- Startscreen -->
  <section class="screen active" id="s-intro">
    <div class="ticket">
      <div class="ticket-top">
        <p class="kicker">Bordkarte 001 · 10.08.2026</p>
        <h1 id="intro-title">Ein Jahr<br>mit dir.</h1>
        <p>Fünf Fragen über unser erstes Jahr. Am Ende habe ich noch etwas für dich.</p>
      </div>
      <div class="perf"></div>
      <div class="ticket-bottom">
        <button class="btn" id="start">Los geht's</button>
      </div>
    </div>
  </section>

  <!-- Fragen -->
  <section class="screen" id="s-quiz">
    <div class="ticket">
      <div class="ticket-top">
        <p class="kicker" id="q-kicker"></p>
        <h2 id="q-text"></h2>
        <p class="muted" id="q-hint"></p>
        <div id="q-body"></div>
      </div>
      <div class="perf"></div>
      <div class="ticket-bottom">
        <div id="q-feedback" aria-live="polite"></div>
        <button class="btn" id="q-action"></button>
      </div>
    </div>
  </section>

  <!-- Punktestand -->
  <section class="screen" id="s-score">
    <div class="ticket">
      <div class="ticket-top">
        <p class="kicker">Auswertung</p>
        <div class="stamp" id="score-stamp"></div>
        <h2 id="score-title"></h2>
        <p class="muted" id="score-text"></p>
      </div>
      <div class="perf"></div>
      <div class="ticket-bottom">
        <button class="btn" id="to-finale">Letzte Frage</button>
      </div>
    </div>
  </section>

  <!-- Finale -->
  <section class="screen" id="s-finale">
    <div class="ticket">
      <div class="ticket-top">
        <p class="kicker">Frage 6 von 5</p>
        <h2 id="finale-q"></h2>
        <div class="finale" id="finale-stage">
          <button class="btn rose" id="yes">Ja, klar</button>
          <button class="btn" id="no">Nein</button>
        </div>
        <p class="gave-up" id="gave-up" hidden>Der Nein-Knopf hat aufgegeben.</p>
      </div>
    </div>
  </section>

  <!-- Video -->
  <section class="screen" id="s-video">
    <div class="video-wrap" id="video-wrap">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <div class="after">
      <h2 id="after-title"></h2>
      <p class="muted">Auf das nächste Jahr.</p>
    </div>
  </section>

</div>
<canvas id="confetti"></canvas>

<script>
/* ============================================================
   ALLES ANPASSBARE STEHT HIER
   ============================================================ */
const CONFIG = {
  name: 'Nina',
  // Variante A: YouTube. Video als "Nicht gelistet" hochladen und hier nur die ID
  // aus dem Link eintragen, also bei youtu.be/dQw4w9WgXcQ nur dQw4w9WgXcQ.
  youtubeId: 'YLucJ2ewqW4',
  // Variante B: eigene Datei. Nur nötig, wenn youtubeId leer bleibt.
  videoSrc: 'video.mp4',        // Datei muss neben index.html liegen
  route: { from: 'KEV', to: 'NIN' },
  finaleQuestion: 'Machst du noch ein Jahr mit mir?',
  afterVideo: 'Ich liebe dich, Nina.',

  questions: [
    {
      type: 'slider',
      label: 'Reisebilanz',
      text: 'Wie viele Kilometer sind wir im ersten Jahr zusammen gereist?',
      hint: 'Schieb den Regler. Luftlinie, hin und zurück gerechnet.',
      unit: 'km',
      min: 0, max: 50000, step: 250, start: 15000,
      answer: 24550,
      tolerance: 1500,
      log: [
        ['Zürich – Teneriffa', "6'130 km"],
        ['Zürich – Dubai', "9'540 km"],
        ['Zürich – Kreta', "3'860 km"],
        ['Zürich – Madrid', "2'480 km"],
        ['Zürich – Mallorca', "1'990 km"],
        ['Luzern – Innsbruck, Auto', '550 km'],
        ['Total', "24'550 km"]
      ],
      reveal: 'Das sind gut 60 Prozent des Erdumfangs. In einem Jahr, fast einmal halb um die Welt.'
    },
    {
      type: 'choice',
      label: 'Tag eins',
      text: 'Wann haben wir uns das erste Mal getroffen?',
      options: [
        { label: '2. Juni 2024' },
        { label: '10. Juni 2024', correct: true },
        { label: '18. Juni 2024' },
        { label: '10. Juli 2024' }
      ],
      reveal: 'Der 10. Juni 2024. Seither ziemlich viel passiert.'
    },
    {
      type: 'choice',
      label: 'Erster Abend',
      text: 'Was wollten wir am ersten gemeinsamen Abend schauen?',
      options: [
        { label: 'Eine Serie auf Netflix' },
        { label: 'Das EM-Spiel der Schweiz', correct: true },
        { label: 'Einen Horrorfilm' },
        { label: 'Nichts, wir haben nur geredet' }
      ],
      reveal: 'Das EM-Spiel der Schweiz. Wie viel wir davon gesehen haben, ist eine andere Frage.'
    },
    {
      type: 'slider',
      label: 'Kamerarolle',
      text: 'Wie viele Fotos von dir sind auf meinem Handy?',
      hint: 'Schätz mal. Es sind mehr, als du denkst.',
      unit: 'Fotos',
      min: 0, max: 1500, step: 1, start: 250,
      answer: 693,
      tolerance: 75,
      reveal: '693. Und es werden jeden Tag mehr.'
    },
    {
      type: 'choice',
      label: 'Erster Eindruck',
      text: 'Was war mein erster Gedanke, als ich dich gesehen habe?',
      options: [
        { label: '"Hübsches Kleid"', correct: true },
        { label: '"Hoffentlich merkt sie nicht, dass ich nervös bin"' },
        { label: '"Die ist zu gut für mich"' },
        { label: '"Bitte keine Fussballfrage"' }
      ],
      reveal: 'Hübsches Kleid. Daran denke ich immer noch.'
    }
  ],

  scoreTexts: {
    5: ['Alles richtig.', 'Du kennst uns besser als mein Fotoarchiv.'],
    4: ['Fast perfekt.', 'Eine Frage hat es nicht ganz gebraucht.'],
    3: ['Solide Hälfte.', 'Den Rest erzähle ich dir gleich nochmal in Ruhe.'],
    0: ['Ehrlich gesagt egal.', 'Es geht ums nächste Jahr, nicht ums letzte.']
  }
};

/* ============================================================
   Ab hier die Mechanik
   ============================================================ */
const qs = CONFIG.questions;
const fmt = n => n.toLocaleString('de-CH').replace(/[’,]/g, "'");
let idx = 0, score = 0, answered = false;

document.getElementById('from').textContent = CONFIG.route.from;
document.getElementById('to').textContent = CONFIG.route.to;
document.getElementById('intro-title').innerHTML = 'Ein Jahr<br>mit dir, ' + CONFIG.name + '.';
document.getElementById('finale-q').textContent = CONFIG.finaleQuestion;
document.getElementById('after-title').textContent = CONFIG.afterVideo;

const dotsEl = document.getElementById('dots');
qs.forEach(() => dotsEl.insertAdjacentHTML('beforeend', '<i class="dot"></i>'));
const dots = [...document.querySelectorAll('.dot')];
function progress(done) {
  dots.forEach((d, i) => d.classList.toggle('on', i < done));
  document.getElementById('plane').style.left = (done / qs.length * 100) + '%';
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

const kicker = document.getElementById('q-kicker');
const qText = document.getElementById('q-text');
const qHint = document.getElementById('q-hint');
const qBody = document.getElementById('q-body');
const qFeed = document.getElementById('q-feedback');
const qAction = document.getElementById('q-action');

function renderQuestion() {
  const q = qs[idx];
  answered = false;
  kicker.textContent = 'Frage ' + (idx + 1) + ' von ' + qs.length + ' · ' + q.label;
  qText.textContent = q.text;
  qHint.textContent = q.hint || '';
  qHint.hidden = !q.hint;
  qFeed.innerHTML = '';
  qBody.innerHTML = '';

  if (q.type === 'slider') {
    qBody.innerHTML =
      '<div class="readout"><b id="val"></b><span>' + q.unit + '</span></div>' +
      '<input type="range" id="range" min="' + q.min + '" max="' + q.max + '" step="' + q.step +
      '" value="' + q.start + '" aria-label="' + q.text + '">' +
      '<div class="scale"><span>' + fmt(q.min) + '</span><span>' + fmt(q.max) + '</span></div>';
    const range = document.getElementById('range'), val = document.getElementById('val');
    const paint = () => val.textContent = fmt(+range.value);
    range.addEventListener('input', paint); paint();
    qAction.textContent = 'Antwort abgeben';
  } else {
    const marks = ['A', 'B', 'C', 'D'];
    qBody.innerHTML = '<div class="opts">' + q.options.map((o, i) =>
      '<button class="opt" data-i="' + i + '"><span class="mark">' + marks[i] + '</span>' + o.label + '</button>'
    ).join('') + '</div>';
    qBody.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pickChoice(+b.dataset.i)));
    qAction.textContent = 'Weiter';
    qAction.disabled = true;
  }
  show('s-quiz');
}

function pickChoice(i) {
  if (answered) return;
  answered = true;
  const q = qs[idx];
  const hit = !!q.options[i].correct;
  if (hit) score++;
  qBody.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (q.options[j].correct) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
  });
  qFeed.innerHTML = '<p class="verdict ' + (hit ? 'hit' : 'miss') + '">' +
    (hit ? 'Richtig.' : 'Knapp daneben.') + '</p><p class="muted">' + q.reveal + '</p>';
  qAction.disabled = false;
}

function submitSlider() {
  const q = qs[idx];
  const guess = +document.getElementById('range').value;
  const diff = Math.abs(guess - q.answer);
  const hit = diff <= q.tolerance;
  if (hit) score++;
  document.getElementById('range').disabled = true;
  let html = '<p class="verdict ' + (hit ? 'hit' : 'miss') + '">' +
    (hit ? 'Treffer. ' : '') + 'Es sind ' + fmt(q.answer) + ' ' + q.unit + '.</p>';
  if (!hit) html += '<p class="muted">Du lagst ' + fmt(diff) + ' ' + q.unit + ' daneben.</p>';
  if (q.log) html += '<div class="log">' + q.log.map((r, i) =>
    '<div class="log-row' + (i === q.log.length - 1 ? ' total' : '') + '"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'
  ).join('') + '</div>';
  html += '<p class="muted">' + q.reveal + '</p>';
  qFeed.innerHTML = html;
  answered = true;
  qAction.textContent = 'Weiter';
}

qAction.addEventListener('click', () => {
  if (qs[idx].type === 'slider' && !answered) { submitSlider(); return; }
  idx++;
  progress(idx);
  if (idx < qs.length) renderQuestion(); else renderScore();
});

function renderScore() {
  const t = CONFIG.scoreTexts[score] || CONFIG.scoreTexts[0];
  document.getElementById('score-stamp').innerHTML = score + ' / ' + qs.length + '<small>richtig</small>';
  document.getElementById('score-title').textContent = t[0];
  document.getElementById('score-text').textContent = t[1];
  show('s-score');
}

document.getElementById('start').addEventListener('click', () => { progress(0); renderQuestion(); });
document.getElementById('to-finale').addEventListener('click', () => { show('s-finale'); placeNo(true); });

/* ---- Der Nein-Knopf, der nicht will ---- */
const stage = document.getElementById('finale-stage');
const no = document.getElementById('no');
const labels = ['Nein', 'Sicher?', 'Wirklich?', 'Nochmal überlegen', 'Letzte Chance', 'Bitte nicht'];
let tries = 0;

function placeNo(init) {
  const w = stage.clientWidth - no.offsetWidth;
  const h = stage.clientHeight - no.offsetHeight;
  if (init) { no.style.left = Math.max(0, w) + 'px'; no.style.top = '110px'; return; }
  no.style.left = Math.round(Math.random() * Math.max(0, w)) + 'px';
  no.style.top = Math.round(80 + Math.random() * Math.max(0, h - 80)) + 'px';
}
function flee(e) {
  e.preventDefault();
  tries++;
  if (tries >= labels.length) {
    no.style.opacity = '0'; no.style.transform = 'scale(.4)';
    setTimeout(() => no.hidden = true, 300);
    document.getElementById('gave-up').hidden = false;
    return;
  }
  no.textContent = labels[tries];
  no.style.transform = 'scale(' + (1 - tries * 0.08) + ')';
  placeNo(false);
}
['pointerdown', 'pointerenter', 'touchstart', 'click'].forEach(ev =>
  no.addEventListener(ev, flee, { passive: false })
);

/* ---- Video ---- */
const wrap = document.getElementById('video-wrap');
const video = document.getElementById('video');
const useYT = !!CONFIG.youtubeId;
let ytPlayer = null, ytReady = false, wantPlay = false;

if (useYT) {
  wrap.innerHTML = '<div class="yt" id="yt"><div id="ytplayer"></div></div>';
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
} else {
  video.src = CONFIG.videoSrc;
  video.addEventListener('error', () => {
    wrap.innerHTML =
      '<div class="vid-note"><b>Video nicht gefunden.</b><br>' +
      'Leg die Datei als <code>' + CONFIG.videoSrc + '</code> neben <code>index.html</code>, ' +
      'oder trag oben im Feld <code>youtubeId</code> deine YouTube-ID ein.</div>';
  });
}

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('ytplayer', {
    videoId: CONFIG.youtubeId,
    host: 'https://www.youtube-nocookie.com',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
    events: { onReady: () => { ytReady = true; if (wantPlay) startYT(); } }
  });
};

function startYT() {
  try { ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); } catch (e) {}
}

function goFullscreen(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) { try { fn.call(el); } catch (e) {} }
}

document.getElementById('yes').addEventListener('click', () => {
  show('s-video');
  progress(qs.length);
  document.querySelector('.route').style.display = 'none';
  if (useYT) {
    goFullscreen(document.getElementById('yt') || wrap);
    if (ytReady) startYT(); else wantPlay = true;
  } else {
    video.play().catch(() => {});
    if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    else goFullscreen(video);
  }
  confetti();
});

/* ---- Konfetti ---- */
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#F0A93B', '#E0596E', '#F4E9D6', '#3F8F6B'];
  const bits = Array.from({ length: 90 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5,
    r: 3 + Math.random() * 5, vy: 1.5 + Math.random() * 3, vx: -1 + Math.random() * 2,
    a: Math.random() * 6, col: colors[(Math.random() * colors.length) | 0]
  }));
  const t0 = performance.now();
  (function loop(t) {
    x.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => {
      b.y += b.vy; b.x += b.vx + Math.sin(b.y / 40) * .6; b.a += .1;
      x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.col;
      x.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * 1.6); x.restore();
    });
    if (t - t0 < 5000) requestAnimationFrame(loop);
    else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}
addEventListener('resize', () => {
  const c = document.getElementById('confetti');
  c.width = innerWidth; c.height = innerHeight;
});
</script>
